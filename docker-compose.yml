# STAMPLAB: MySQL + backend (API) + frontend (React compilado).
# Uso:  cp .env.example .env  &&  docker compose up --build
# Los puertos del equipo se pueden cambiar en .env (HOST_DB_PORT, HOST_BACKEND_PORT, HOST_FRONTEND_PORT)
# si ya tienes MySQL/MariaDB u otros servicios usando 3306, 3000 o 5173.
services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${HOST_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - app-network

  backend:
    build: ./backend
    image: stamplab-backend:1.0
    container_name: node_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@stamplab.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123*}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_MODO: ${MAIL_MODO:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
      PLAZO_PAGO_HORAS: ${PLAZO_PAGO_HORAS:-48}
      VIGENCIA_COTIZACION_DIAS: ${VIGENCIA_COTIZACION_DIAS:-30}
      COSTO_ENVIO: ${COSTO_ENVIO:-0}
      STOCK_MINIMO: ${STOCK_MINIMO:-5}
      WHATSAPP: ${WHATSAPP:-}
      AUTH_MAX_FALLOS: ${AUTH_MAX_FALLOS:-15}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${HOST_BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Las imagenes subidas (productos, tecnicas, disenos) viven fuera del contenedor
      - ./backend/uploads:/app/uploads
    networks:
      - app-network
    # Migraciones (crean las tablas la primera vez) + roles/estados/administrador, y arranca la API
    command: sh -c "npx sequelize-cli db:migrate && node scripts/seed-base.js && npm start"

  frontend:
    build:
      context: ./frontend
      args:
        # URL del backend tal como la ve el NAVEGADOR (se incrusta al compilar)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    image: stamplab-frontend:1.0
    container_name: react_frontend
    restart: unless-stopped
    ports:
      - "${HOST_FRONTEND_PORT:-5173}:3000"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
